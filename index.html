<!DOCTYPE html>
<html lang ="es">

<head>
    <meta charset="UTF-8">
    <title>Quiz Especial!!</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #ff5d8f, #8d3ed6);

        }

        .tarjeta {
            width: min(700px, 90%);
            min-height: 390px;
            padding: 42px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 12px 35px rgba(0, 0, 0, .25);
        }

        h1 {font-size: 38px; }
        p { font-size: 20px; line-height: 1.55; }

        button {
            margin: 10px;
            padding: 14px 25px;
            border: 0;
            border-radius: 30px;
            color: white;
            font-size: 17px;
            cursor: pointer;
            background: #ff286d;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            transform: scale(1.06);
            background: #ff0f59;
        }

        #opciones { margin-top: 28px; }

        .imagen-reaccion {
            width: min(280px, 80%);
            max-height: 260px;
            margin: 10px auto 20px;
            display: block;
            object-fit: contain;
            border-radius: 18px;
            animation: aparecer 0.45s ease-out;
        }

        .imagen-memoria {
            width: min(440px, 90%);
            max-height: 360px;
            display: block;
            margin: 18px auto;
            object-fit: contain;
            border: 4px solid rgba(255, 255, 255, 0.75);
            border-radius: 18px;
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.35);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0,7) rotate(-4deg);
            }

            to{
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        body.modo-triste {
  background: #000;
  color: #d4d4d4;
}

body.modo-triste .tarjeta {
  background: #111;
  box-shadow: 0 12px 35px rgba(255, 255, 255, 0.08);
}

body.modo-triste button {
  background: #3c3c3c;
}

body.modo-triste button:hover {
  background: #555;
}

.gatito-triste {
  width: min(220px, 70%);
  max-height: 220px;
  display: block;
  margin: 20px auto 10px;
  object-fit: contain;
  filter: grayscale(0.4);
  animation: aparecer 0.7s ease-out;
}

body {
    transition: background 1s ease;
}

.tarjeta {
    transition: background 0.8s ease, box-shadow 0.8s ease;
}

.transicion-triste {
    animation: despedida 0.75s ease-in forwards;
}

.entrada-triste {
    animation: llegada-triste 0.8s ease-out;
}

@keyframes despedida {
    from {
        opacity: 1; 
        transform: scale(1);
        filter: blur(0);
    }

    to{
        opacity: 0;
        transform: scale(0.88);
        filter: blur(7px);
    }
}

@keyframes llegada-triste {
    from {
        opacity: 0;
        transform: scale(0.92);
        filter: blur(6px);
    } 
     from {
        opacity: 0;
        transform: scale(0.92);
        filter: blur(6px);
     }

     to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
     }
}

#juego-canvas {
    width: min(620px, 100%);
    margin-top: 15px;
    border: 3px solid #ff72af;
    border-radius: 14px;
    box-shadow: 0 0 18px rgba(255, 70, 150, 0.55);
}
        </style>
        </head>
        <body>
        <audio id="musica" loop>
            <source src="musica.mp3" type="audio/mpeg">
        </audio>

        <main class="tarjeta" id="pantalla">
        <h1>Bienvenido al Quiz :)</h1>
        <p>Son 20 preguntas pero la ultima es muy divertida</p>
        <button id="boton-comenzar">COMENZAR</button>
        </main>

        <script src="renderer.js"></script>
        </body>
        </html>
